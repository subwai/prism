packages:
  # Include the app manifest in Changesets versioning.
  - .
  - processes/*
  - packages/**
  - e2e
  - .github

# macOS releases build both architectures from one host.
supportedArchitectures:
  cpu: [arm64, x64]
  os: [current]

catalog:
  '@tanstack/react-virtual': 3.14.19
  lucide-react: 1.57.0
  react-zoom-pan-pinch: 4.2.0
  sharp: 0.35.5
  vitest: 5.0.4
  '@vitest/ui': 5.0.4
  playwright-core: 1.64.0
  rrweb-snapshot: 2.1.1
  '@types/node': 24.19.2
  electron: 44.7.2
  electron-vite: 6.0.0
  typescript: 7.0.2
  vite: 8.3.4
  oxlint: 1.88.0
  oxfmt: 0.73.0
  '@react-router/dev': 8.4.0
  '@react-router/node': 8.4.0
  '@react-router/remix-routes-option-adapter': 8.4.0
  remix-flat-routes: 0.8.5
  react-router: 8.4.0
  react: 19.3.1
  react-dom: 19.3.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@tailwindcss/vite': 4.3.3
  tailwindcss: 4.3.3
  tw-shimmer: 0.4.13
  '@fontsource-variable/public-sans': 5.2.7
  electron-builder: 26.17.0
  electron-updater: 6.8.9
  jsonc-parser: 3.3.1
  '@changesets/cli': 3.0.3
  turbo: 2.11.9

allowBuilds:
  electron: true
  # Windows releases use NSIS rather than Squirrel.Windows.
  electron-winstaller: false

minimumReleaseAgeExclude:
  - electron-vite@6.0.0
  - react-dom@19.3.1
  - react@19.3.1
