packages:
  # Include the app manifest in Changesets versioning.
  - .
  - processes/*
  - packages/**
  - e2e
  - .github

# macOS releases build both architectures from one host.
supportedArchitectures:
  cpu: [arm64, x64]
  os: [current]

catalog:
  '@tanstack/react-query': 5.104.0
  '@tanstack/react-virtual': 3.14.22
  '@base-ui/react': 1.9.0
  lucide-react: 1.61.0
  react-zoom-pan-pinch: 4.2.0
  sharp: 0.35.5
  p-limit: 7.3.3
  exifr: 7.1.3
  # Writes ratings into photos' XMP; reading stays with exifr.
  exiftool-vendored: 39.0.1
  drizzle-orm: 1.0.0-rc.5
  drizzle-kit: 1.0.0-rc.5
  lru-cache: 11.5.2
  obug: 3.0.0
  valibot: 1.5.0
  '@napi-rs/cli': 3.10.8
  vitest: 5.0.5
  '@vitest/ui': 5.0.5
  '@vitest/browser-playwright': 5.0.5
  vitest-browser-react: 2.3.0
  playwright-core: 1.64.1
  playwright: 1.64.1
  axe-core: 4.14.0
  rrweb-snapshot: 2.1.7
  '@types/node': 24.19.2
  electron: 45.0.0
  electron-vite: 6.0.0
  # tsrs, the Rust port of TypeScript 7, as a drop-in for the typescript package.
  typescript: npm:@tsc-rs/typescript@0.8.0
  vite: 8.3.5
  oxlint: 1.89.0
  oxfmt: 0.74.0
  lefthook: 2.2.2
  '@react-router/dev': 8.5.0
  '@react-router/node': 8.5.0
  '@react-router/remix-routes-option-adapter': 8.5.0
  remix-flat-routes: 0.8.5
  react-router: 8.5.0
  react: 19.3.1
  react-dom: 19.3.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@tailwindcss/vite': 4.3.3
  '@vitejs/plugin-react': 6.2.1
  vite-plugin-devtools-json: 1.1.1
  # The Rust port of React Compiler, which `@vitejs/plugin-react` runs.
  oxc-transform-react: 0.156.0
  tailwindcss: 4.3.3
  tw-shimmer: 0.4.14
  tailwind-merge: 3.7.0
  tailwind-variants: 3.3.1
  '@fontsource-variable/public-sans': 5.3.0
  electron-builder: 26.18.0
  electron-updater: 6.8.11
  fflate: 0.8.3
  jsonc-parser: 3.3.1
  '@changesets/cli': 3.0.3
  # Pinned exactly: its experimental changelog template can change in a patch.
  '@changesets/changelog-github': 1.0.1
  turbo: 2.11.10
  knip: 6.44.2

allowBuilds:
  # Its install script sets up the Git hooks in lefthook.yml.
  lefthook: true
  # Windows releases use NSIS rather than Squirrel.Windows.
  electron-winstaller: false
  # Its install script swaps `tsc`'s Node launcher for a shell one, which skips starting Node.
  '@tsc-rs/typescript': true

# Link packages from one virtual store shared by every checkout, rather than one per project.
enableGlobalVirtualStore: true

# These packages' types import others they don't declare. Hoisting used to make those
# reachable, but packages in the global virtual store only see what they declare.
packageExtensions:
  playwright-core:
    peerDependencies:
      electron: '*'
    peerDependenciesMeta:
      electron:
        optional: true
  react-zoom-pan-pinch:
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true

# Where `pnpm approve` links the agent skills that dependencies ship.
skills:
  dirs:
    - .claude/skills

permissions:
  # Links its Drizzle Kit skill. It has no install script, so `build` changes nothing.
  drizzle-kit:
    build: true
    skills: true
