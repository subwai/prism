appId: com.subwai.prism
productName: Prism
artifactName: ${name}-${version}-${os}-${arch}.${ext}
electronUpdaterCompatibility: '>=6.8.9'
# GitHub release flags separate previews from stable releases; both use latest*.yml.
detectUpdateChannel: false
directories:
  # Icons and other packaging inputs; everything generated stays under out/.
  buildResources: resources
  output: out/release
files:
  - out/main/**
  - out/preload/**
  - out/renderer/client/**
asarUnpack:
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'
# Sharp stays external so its platform-specific native binaries can load.
npmRebuild: false
mac:
  # Drawn with the margin and corners of Apple's template, which icon.png's circle lacks.
  icon: icon-mac.png
  # Self-signed test builds cannot be notarized or use Apple team-based library validation.
  notarize: false
  hardenedRuntime: false
  target:
    - dmg
    - zip
win:
  target: nsis
linux:
  target: AppImage
  category: Utility
publish:
  provider: github
  owner: subwai
  repo: prism
  private: true
  releaseType: draft
