appId: com.subwai.prism
productName: Prism
artifactName: ${name}-${version}-${os}-${arch}.${ext}
electronUpdaterCompatibility: '>=6.8.9'
directories:
  # The icons, from the brand package; everything generated stays under out/.
  buildResources: node_modules/@prism/brand/icons
  output: out/release
files:
  - out/main/**
  - out/preload/**
  - out/renderer/client/**
  # Only the Windows imaging addon and its loader, without the Rust it is built from.
  - '!**/node_modules/@prism/windows-imaging/**'
  - '**/node_modules/@prism/windows-imaging/{package.json,index.js,*.node}'
asarUnpack:
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'
  - '**/node_modules/@prism/windows-imaging/*.node'
  # ExifTool runs from outside the archive, which exiftool-vendored looks for.
  - '**/node_modules/exiftool-vendored.pl/**'
  - '**/node_modules/exiftool-vendored.exe/**'
# Sharp, the Windows imaging addon and ExifTool stay external so their binaries can run.
npmRebuild: false
# The GPL asks for the license to travel with every copy of the app.
extraResources:
  - LICENSE
mac:
  # Drawn with the margin and corners of Apple's template, which icon.png's circle lacks.
  icon: icon-mac.png
  # Self-signed test builds cannot be notarized or use Apple team-based library validation.
  notarize: false
  hardenedRuntime: false
  target:
    - dmg
    - zip
win:
  target: nsis
linux:
  target: AppImage
  category: Utility
publish:
  provider: github
  owner: subwai
  repo: prism
  releaseType: draft
