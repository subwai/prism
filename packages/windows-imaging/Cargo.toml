[package]
name = "prism-windows-imaging"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "=3.14.2", default-features = false, features = ["napi4"] }
# Without generated types, which would replace the hand-written index.d.ts.
napi-derive = { version = "=3.6.12", default-features = false, features = ["strict"] }
windows = { version = "=0.62.2", default-features = false, features = [
  "Win32_Foundation",
  "Win32_Graphics_Imaging",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Shell",
] }

[build-dependencies]
napi-build = "=2.6.0"

[profile.release]
lto = true
strip = "symbols"
