name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Finish each release before starting the next so older metadata cannot overwrite newer releases.
concurrency:
  group: release-main
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      # GitHub doesn't start workflows for pushes and pull requests made with GITHUB_TOKEN, so the
      # release PR comes from the release app instead, and its Checks run without approval.
      - name: Create release app token
        id: app-token
        if: github.ref == 'refs/heads/main'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create or update release PR
        if: github.ref == 'refs/heads/main'
        uses: changesets/action@v2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: pnpm version:release
          commit-message: 'Release app version'
          pr-title: 'Release app version'
          create-github-releases: false

  # Only a version without a published release is built: the release PR's merge, or a rerun of
  # one that failed. Other pushes to main stop here. The build jobs upload straight to this
  # draft, so the installers never use the account's artifact storage, and nothing shows until
  # publish. Making it once, before they start, keeps them from each creating their own.
  draft:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          save-cache: false
          require-lockfile: true
      - id: version
        uses: ./.github/actions/version
      # The notes are the version's changelog section, written from the changesets. A draft that
      # already exists, such as on a rerun, is left as it is. electron-builder adds to a draft and
      # leaves a published release alone.
      - name: Create draft release
        id: release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.version.outputs.notes }}
        run: |
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null); then
            [ "$draft" = true ] || { echo "$TAG is already released."; exit 0; }
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "Prism $VERSION" --notes-file "$NOTES"
          fi
          echo release=true >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    # Run by hand from another branch, it only builds.
    if: needs.draft.outputs.release == 'true' || github.ref != 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            args: --mac --arm64 --x64 --config.forceCodeSigning=true
          - os: windows-latest
            platform: win
            args: --win --x64
          - os: ubuntu-latest
            platform: linux
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # On Windows, only the store's content, which the Checks workflow's windows job
      # restores. A link Windows restores from the cache is one pnpm is denied.
      - id: windows-store
        if: matrix.platform == 'win'
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/setup-pnpm/store/*/files
            ${{ runner.temp }}/setup-pnpm/store/*/index.db
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-
      - uses: pnpm/setup@v3
        with:
          cache: ${{ matrix.platform != 'win' }}
          # The prepare job saves the Linux store already.
          save-cache: ${{ matrix.platform != 'linux' }}
          require-lockfile: true
          # On Windows, on the checkout's drive, as in the Checks workflow's windows job.
          dest: ${{ matrix.platform == 'win' && format('{0}/setup-pnpm', runner.temp) || '~/setup-pnpm' }}
      # The Windows imaging addon's Cargo dependencies, which the Checks workflow restores.
      - if: matrix.platform == 'win'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/windows-imaging
            packages/trash
          shared-key: windows-imaging
      # The Trash addon's elsewhere, which the Checks workflow restores on Linux.
      - if: matrix.platform != 'win'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/trash
          shared-key: trash
      # The Trash addon is built for both kinds of Mac, from the runner's Apple silicon.
      - if: matrix.platform == 'mac'
        run: rustup target add x86_64-apple-darwin
      - name: Configure macOS test signing
        if: matrix.platform == 'mac'
        timeout-minutes: 3
        uses: ./.github/actions/sign-macos
        with:
          certificate: ${{ secrets.CSC_LINK }}
          password: ${{ secrets.CSC_KEY_PASSWORD }}
          public-certificate: ${{ secrets.MAC_SELF_SIGNED_CERT }}
      # Uploads the installers and update metadata to the draft. Without one, it only builds.
      - name: Build and upload installers and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: pnpm turbo dist:publish -- ${{ matrix.args }}
      # What a new lockfile no longer uses, before the Windows store is saved under its key.
      - if: matrix.platform == 'win' && steps.windows-store.outputs.cache-hit != 'true'
        run: pnpm store prune

  publish:
    needs: [draft, build]
    if: needs.draft.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.draft.outputs.version }}
    steps:
      # electron-builder skips, rather than fails, when it finds no draft to add to, so check
      # that every platform's update metadata arrived before the updater can see the release.
      - name: Check every platform uploaded
        run: |
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for file in latest.yml latest-mac.yml latest-linux.yml; do
            grep -qx "$file" <<< "$assets" || { echo "::error::$TAG is missing $file"; exit 1; }
          done
      - name: Publish complete release
        run: gh release edit "$TAG" --draft=false
