name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Finish each release before starting the next so older metadata cannot overwrite newer releases.
concurrency:
  group: release-main
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      # GitHub doesn't start workflows for pushes and pull requests made with GITHUB_TOKEN, so the
      # release PR comes from the release app instead, and its Checks run without approval.
      - name: Create release app token
        id: app-token
        if: github.ref == 'refs/heads/main'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create or update release PR
        if: github.ref == 'refs/heads/main'
        uses: changesets/action@v2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: pnpm version:release
          commit-message: 'Release app version'
          pr-title: 'Release app version'
          create-github-releases: false

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            args: --mac --arm64 --x64 --config.forceCodeSigning=true
          - os: windows-latest
            platform: win
            args: --win --x64
          - os: ubuntu-latest
            platform: linux
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - id: version
        uses: ./.github/actions/version
      - name: Configure macOS test signing
        if: matrix.platform == 'mac'
        timeout-minutes: 3
        uses: ./.github/actions/sign-macos
        with:
          certificate: ${{ secrets.CSC_LINK }}
          password: ${{ secrets.CSC_KEY_PASSWORD }}
          public-certificate: ${{ secrets.MAC_SELF_SIGNED_CERT }}
      - name: Build installers and update metadata
        env:
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: pnpm turbo dist -- ${{ matrix.args }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          compression-level: 0
          # Only the publish job reads these, and the release keeps the files, so they need not
          # use up the account's artifact storage.
          retention-days: 1
          path: |
            out/release/*.dmg
            out/release/*.zip
            out/release/*.exe
            out/release/*.AppImage
            out/release/*.blockmap
            out/release/latest*.yml

  publish:
    needs: [prepare, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: out/release
      - name: Publish complete release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ needs.build.outputs.version }}
          commit: ${{ github.sha }}
          prerelease: ${{ needs.build.outputs.prerelease }}
          artifacts: out/release/*
          artifactErrorsFailBuild: true
          immutableCreate: true
          allowUpdates: true
          updateOnlyUnreleased: true
          skipIfReleaseExists: true
          generateReleaseNotes: true
