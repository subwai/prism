name: Checks

on:
  workflow_dispatch:

permissions:
  contents: read

# DIAG: runs the checks over and over, in parallel jobs, to catch flaky component tests with
# their diagnostics. Not for merging.
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/setup@v3
        with:
          cache: true
          save-cache: false
          require-lockfile: true
      - run: |
          failed=0
          for i in 1 2 3 4 5; do
            echo "::group::iteration $i"
            pnpm turbo lint check test --force --continue --filter='!@prism/e2e' || { echo "DIAG ITERATION $i FAILED"; failed=1; }
            echo "::endgroup::"
          done
          exit $failed
