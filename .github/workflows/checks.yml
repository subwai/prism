name: Checks

on:
  workflow_dispatch:

permissions:
  contents: read

# DIAG: runs the reader's tests over and over on busy runners, to catch the zoom toggle landing on
# the wrong fit, with its diagnostics. Not for merging.
jobs:
  zoom:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [focused, full]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/setup@v3
        with:
          cache: true
          save-cache: false
          require-lockfile: true
      # Builds what the tests need, and installs the browser.
      - run: pnpm turbo test -F @prism/renderer
        continue-on-error: true
      - run: |
          # Other checks running alongside, as on a pull request.
          (while true; do pnpm turbo lint check --force --filter='!@prism/e2e' > /dev/null 2>&1; done) &
          cd processes/renderer
          failed=0
          if [ "${{ matrix.mode }}" = focused ]; then
            files=src/components/viewer/__tests__/viewer-zoom.test.tsx
            runs=80
          else
            files=
            runs=10
          fi
          for i in $(seq $runs); do
            pnpm exec vitest run --project component $files || { echo "DIAG RUN $i FAILED"; failed=1; }
          done
          exit $failed
