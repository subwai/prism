name: Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm turbo lint check format:check
      - run: pnpm turbo test --filter='!@app/e2e'
      # The end-to-end tests launch Electron, which needs a display: Xvfb on Linux runners.
      # That display is virtual, so the window can show, which renders faster than hidden and
      # covers full screen. Turbo passes `--mode` to the tests, not to the builds before them.
      - run: xvfb-run --auto-servernum pnpm turbo test -F @app/e2e -- --mode headed
