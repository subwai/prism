name: Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The restored turbo cache keeps every earlier run's entries, so it drops the old ones.
  TURBO_CACHE_MAX_AGE: 7d

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          # Restore the store the Release workflow saves on main, rather than save one per PR.
          save-cache: false
          require-lockfile: true
      # Turbo's own cache, so a push that leaves a package alone skips its tasks. Each run saves
      # under its commit, and restores the newest of this pull request's earlier runs. It holds
      # the builds' output and the tasks' logs, a few megabytes, so unlike the store it saves here.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-checks-${{ github.sha }}
          restore-keys: turbo-checks-
      - run: pnpm turbo lint check format:check
      - run: pnpm turbo test --filter='!@prism/e2e'

  # The end-to-end tests take the longest, so they run beside the other checks, split by the
  # Vitest projects in e2e/vitest.config.ts. The `alone` files run one at a time, so each half
  # gets its own runner, and its own display, rather than waiting for the other.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        project: [app, alone]
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          save-cache: false
          require-lockfile: true
      # As in the checks job. The tests' hash covers the app's builds, so a change to the app runs
      # them again, while a change elsewhere, such as to the docs, skips them.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-e2e-${{ matrix.project }}-${{ github.sha }}
          restore-keys: turbo-e2e-${{ matrix.project }}-
      # The end-to-end tests launch Electron, which needs a display: Xvfb on Linux runners.
      # That display is virtual, so the window can show, which renders faster than hidden and
      # covers full screen. Turbo passes `--mode` to the tests, not to the builds before them.
      # The runner has two cores, which Vitest would leave one worker of, but the tests mostly
      # wait on the app, so two apps at a time still finish sooner.
      - run: >-
          xvfb-run --auto-servernum pnpm turbo test -F @prism/e2e --
          --mode headed --maxWorkers=2 --project ${{ matrix.project }}
      # Screenshot tests keep one set per platform, and record a missing one rather than fail.
      # Linux's are recorded here, so download them from these artifacts to commit them, along
      # with what any failed comparison saw. They are a convenience, so a failed upload, such as
      # with the account's artifact storage full, leaves the checks' result alone, and a run
      # whose screenshots all matched uploads nothing.
      - id: screenshots
        if: always()
        run: |
          changed=$(git ls-files --others --modified -- 'e2e/tests/__screenshots__/*-linux*.png')
          echo "changed=${changed:+true}" >> "$GITHUB_OUTPUT"
      - if: always() && steps.screenshots.outputs.changed
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: linux-screenshots-${{ matrix.project }}
          path: e2e/tests/__screenshots__/*-linux*.png
          if-no-files-found: ignore
          retention-days: 3

  # The Windows imaging addon builds on Windows only, and its tests decode photos with the
  # runner's own codecs. The runner has Rust, and no HEIF codec, which the tests expect.
  windows-imaging:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          save-cache: false
          require-lockfile: true
          # On the checkout's drive, D:, since pnpm can only link packages from a store on the
          # same drive. Left on C:, the install uses another store, and the one restored here
          # goes unused, along with the Node.js in it.
          dest: ${{ runner.temp }}/setup-pnpm
      # As in the checks job. Turbo's hash for the addon's build is the same on every platform,
      # and only Windows builds it, so this cache stays Windows' own.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-windows-imaging-${{ github.sha }}
          restore-keys: turbo-windows-imaging-
      # Cargo's dependencies, for when the addon changes and turbo builds it again. The Release
      # workflow's Windows build saves them on main, which builds the addon the same way.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/windows-imaging
          shared-key: windows-imaging
          save-if: false
      - run: pnpm turbo test -F @prism/windows-imaging
