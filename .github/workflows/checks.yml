name: Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      # The end-to-end tests launch Electron, which needs a display: Xvfb on Linux runners.
      # That display is virtual, so the window can show, which renders faster than hidden.
      - run: xvfb-run --auto-servernum pnpm turbo lint check test format:check
        env:
          ELECTRON_HEADLESS: '0'
