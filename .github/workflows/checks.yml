name: Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A pull request runs only the tasks its changes affect, and a run by hand runs them all.
env:
  AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # The history, without the files' contents, so Turborepo can compare the branch with main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/setup@v3
        with:
          cache: true
          # Restore the store the Release workflow saves on main, rather than save one per PR.
          save-cache: false
          require-lockfile: true
      # Formatting, Knip and boundaries read the whole repository, so they always run.
      - run: pnpm turbo format:check knip
      # Imports stay inside their package, or go through a declared dependency.
      - run: pnpm turbo boundaries
      - run: pnpm turbo lint check test $AFFECTED --filter='!@prism/e2e'

  # The end-to-end tests take the longest, so they run beside the other checks.
  e2e:
    runs-on: ubuntu-latest
    steps:
      # The history, without the files' contents, so Turborepo can compare the branch with main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/setup@v3
        with:
          cache: true
          save-cache: false
          require-lockfile: true
      # The end-to-end tests launch Electron, which needs a display: Xvfb on Linux runners.
      # That display is virtual, so the window can show, which renders faster than hidden and
      # covers full screen. Turbo passes `--mode` to the tests, not to the builds before them.
      # The runner has two cores, which Vitest would leave one worker of, but the tests mostly
      # wait on the app, so two apps at a time still finish sooner.
      - run: xvfb-run --auto-servernum pnpm turbo test -F @prism/e2e $AFFECTED -- --mode headed --maxWorkers=2
      # Screenshot tests keep one set per platform, and record a missing one rather than fail.
      # Linux's are recorded here, so download them from this artifact to commit them, along
      # with what any failed comparison saw. They are a convenience, so a failed upload, such as
      # with the account's artifact storage full, leaves the checks' result alone, and a run
      # whose screenshots all matched uploads nothing.
      - id: screenshots
        if: always()
        run: |
          changed=$(git ls-files --others --modified -- 'e2e/tests/__screenshots__/*-linux*.png')
          echo "changed=${changed:+true}" >> "$GITHUB_OUTPUT"
      - if: always() && steps.screenshots.outputs.changed
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: linux-screenshots
          path: e2e/tests/__screenshots__/*-linux*.png
          if-no-files-found: ignore
          retention-days: 3

  # The Windows imaging addon builds on Windows only, and its tests decode photos with the
  # runner's own codecs. The runner has Rust, and no HEIF codec, which the tests expect.
  windows-imaging:
    runs-on: windows-latest
    steps:
      # The history, without the files' contents, so Turborepo can compare the branch with main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      # The store's content, which the Release workflow's Windows build saves on main. pnpm/setup
      # would cache the whole store, with the global virtual store's links and the projects
      # linked to it, and a link Windows restores from the cache is one pnpm is denied.
      - uses: actions/cache/restore@v5
        with:
          path: |
            ${{ runner.temp }}/setup-pnpm/store/*/files
            ${{ runner.temp }}/setup-pnpm/store/*/index.db
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-
      - uses: pnpm/setup@v3
        with:
          require-lockfile: true
          # On the checkout's drive, D:, since pnpm can only link packages from a store on the
          # same drive. Left on C:, the install uses another store, and the one restored here
          # goes unused, along with the Node.js in it.
          dest: ${{ runner.temp }}/setup-pnpm
      # Cargo's dependencies. The Release workflow's Windows build saves them on main, which
      # builds the addon the same way.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/windows-imaging
          shared-key: windows-imaging
          save-if: false
      # In bash, which reads `$AFFECTED` from the environment, as PowerShell would not.
      - run: pnpm turbo test -F @prism/windows-imaging $AFFECTED
        shell: bash
