name: Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm turbo lint check format:check
      - run: pnpm turbo test --filter='!@prism/e2e'
      # The end-to-end tests launch Electron, which needs a display: Xvfb on Linux runners.
      # That display is virtual, so the window can show, which renders faster than hidden and
      # covers full screen. Turbo passes `--mode` to the tests, not to the builds before them.
      - run: xvfb-run --auto-servernum pnpm turbo test -F @prism/e2e -- --mode headed
      # Screenshot tests keep one set per platform, and record a missing one rather than fail.
      # Linux's are recorded here, so download them from this artifact to commit them, along
      # with what any failed comparison saw. They are a convenience, so a failed upload, such as
      # with the account's artifact storage full, leaves the checks' result alone.
      - if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: linux-screenshots
          path: e2e/tests/__screenshots__/*-linux*.png
          if-no-files-found: ignore
          retention-days: 7
