name: Version app build
description: Read the committed app version and its release notes.
outputs:
  version:
    description: App version to build.
    value: ${{ steps.version.outputs.version }}
  notes:
    description: Path to this version's release notes, from its changelog section.
    value: ${{ steps.version.outputs.notes }}
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: node "$GITHUB_ACTION_PATH/index.ts"
